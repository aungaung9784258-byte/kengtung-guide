<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kengtung Guide — Place Editor</title>

<!-- Leaflet: only used for the click-to-pick map. The editor works without
     it (manual lat/lng entry), so a missing connection degrades gracefully. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --jade:#0FA47F; --jade-deep:#07634F; --gold:#FFB020; --danger:#E5484D;
  --bg:#F7F8F5; --surface:#fff; --alt:#F1F3EF; --text:#11231D; --muted:#6E7B76;
  --line:#e2e7e3; --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0B1412;--surface:#13201C;--alt:#1A2A25;--text:#E8F1ED;--muted:#8FA39C;--line:#24352f}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 system-ui,"Segoe UI",Roboto,"Padauk","Noto Sans Myanmar",sans-serif}
.my{font-family:"Padauk","Noto Sans Myanmar","Myanmar Text",sans-serif;line-height:1.9}

header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--jade),var(--jade-deep));
  color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  box-shadow:0 4px 20px rgba(0,0,0,.18)}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px}
header .sp{flex:1}
.badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}

button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;
  background:var(--alt);color:var(--text);transition:.15s}
button:hover{filter:brightness(.95)} button:active{transform:scale(.97)}
.primary{background:var(--jade);color:#fff}
.gold{background:var(--gold);color:#3A2600}
.danger{background:var(--danger);color:#fff}
.ghost{background:rgba(255,255,255,.18);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}

.wrap{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}

#list{max-height:72vh;overflow:auto}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--alt)}
.item.sel{background:var(--alt);border-color:var(--jade)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.item b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:11.5px}
.item .warn{color:var(--gold);font-size:14px}

label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--jade);border-color:transparent}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.err{border-color:var(--danger)!important}
.errmsg{color:var(--danger);font-size:12px;font-weight:600;margin-top:4px}

#map{height:330px;border-radius:12px;border:1px solid var(--line);background:var(--alt)}
#mapFallback{padding:24px;text-align:center;color:var(--muted);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{background:var(--alt);border-radius:20px;padding:5px 10px;font-size:12.5px;display:flex;gap:7px;align-items:center}
.chip b{cursor:pointer;color:var(--danger);font-size:15px;line-height:1}
.chip.sug{cursor:pointer;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.chip.sug:hover{border-color:var(--jade);color:var(--jade)}

.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.img{position:relative;width:92px;height:68px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--alt)}
.img img{width:100%;height:100%;object-fit:cover}
.img span{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;
  padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img b{position:absolute;top:3px;right:4px;background:var(--danger);color:#fff;width:17px;height:17px;
  border-radius:50%;font-size:12px;display:grid;place-items:center;cursor:pointer}
.ph{display:grid;place-items:center;height:100%;color:var(--muted);font-size:10px;text-align:center;padding:4px}

.bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--jade);color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;
  box-shadow:0 8px 30px rgba(0,0,0,.3);transition:.3s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--danger)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text)}
code{background:var(--alt);padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<header>
  <h1>🗺️ Kengtung Guide — Place Editor</h1>
  <span class="badge" id="count">0 places</span>
  <span class="sp"></span>
  <button class="ghost" onclick="file.click()">📂 Load places.json</button>
  <button class="ghost" onclick="addNew()">➕ New place</button>
  <button class="gold" onclick="save()">💾 Download places.json</button>
  <input type="file" id="file" accept=".json" hidden>
</header>

<div class="wrap">
  <!-- ------------------------------------------------ left: list -->
  <div>
    <div class="card">
      <h2>Places</h2>
      <input id="filter" placeholder="Filter by name, category, id…" oninput="renderList()">
      <div id="list" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Status</h2>
      <div id="status" class="hint"></div>
    </div>
  </div>

  <!-- ------------------------------------------------ right: form -->
  <div id="editor"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =======================================================================
   Data
   ======================================================================= */
const CATS = [
  ['place','Places to Visit','#0FA47F'], ['pagoda','Pagodas','#FFB020'],
  ['market','Markets','#F2762E'],        ['transport','Transportation','#6C5CE7'],
  ['hotel','Hotels','#2E8BF2'],          ['restaurant','Restaurants','#E2457A'],
  ['education','Education','#00A3A1'],   ['bank','Banks & ATMs','#1F4E8C'],
  ['emergency','Emergency','#E5484D'],
];
const catColor = id => (CATS.find(c=>c[0]===id)||CATS[0])[2];

/* Burmese keyword suggestions, offered per category so Myanmar search works. */
const TAG_SUGGEST = {
  place:['နေရာ','လည်ပတ်','ခရီးသွား','ရှုခင်း'],
  pagoda:['ဘုရား','ကျောင်း','စေတီ','ဘာသာရေး'],
  market:['ဈေး','ဈေးတန်း','ဈေးဝယ်','ကုန်ပစ္စည်း'],
  transport:['သယ်ယူပို့ဆောင်','ကား','လမ်းပန်း'],
  hotel:['ဟိုတယ်','တည်းခို','အိပ်ခန်း'],
  restaurant:['စားသောက်ဆိုင်','အစားအစာ','ထမင်းဆိုင်','ကော်ဖီ'],
  education:['ပညာရေး','ကျောင်း','တက္ကသိုလ်','ကောလိပ်','အထက','သင်ကြားရေး'],
  bank:['ဘဏ်','ငွေထုတ်စက်','ATM','ငွေလဲ','ငွေသွင်း'],
  emergency:['အရေးပေါ်','ဆေးရုံ','ဆေးခန်း','ရဲစခန်း'],
};

const KENGTUNG = [21.2913, 99.6002];
let places = [], sel = -1, map = null, marker = null;

/* =======================================================================
   Myanmar helper — same ordering repair the Dart app uses.
   Keyboards emit ေ / ြ BEFORE the consonant because that is where they
   render. Unicode stores them after. Identical on screen, different bytes.
   ======================================================================= */
const MY_BASE = '\u1000-\u102A\u103F\u104E';
const PREFIX  = new RegExp('([\u1031\u103C]+)([' + MY_BASE + '])','g');
function reorderMy(s){
  if(!s || (!s.includes('\u1031') && !s.includes('\u103C'))) return s;
  let out = s;
  for(let i=0;i<4;i++){
    const n = out.replace(PREFIX,'$2$1');
    if(n===out) break;
    out = n;
  }
  return out;
}
/* An ေ or ြ with no consonant in front of it = the user typed out of order. */
const ORPHAN = new RegExp('(^|[^' + MY_BASE + '])[\u1031\u103C]');
const hasOrphan = s => ORPHAN.test(s||'');

/* =======================================================================
   Helpers
   ======================================================================= */
const $ = id => document.getElementById(id);
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => (s||'').toLowerCase().normalize('NFKD')
  .replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,50);

function toast(msg, bad){
  const t=$('toast'); t.textContent=msg; t.className='toast show'+(bad?' bad':'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2600);
}
function blank(){
  return {id:'',name:{en:'',my:''},category:'place',description:{en:'',my:''},
          address:{en:'',my:''},lat:KENGTUNG[0],lng:KENGTUNG[1],
          phone:'',openHours:'',rating:null,tags:[],images:[]};
}

/* ---- autosave so a closed tab never loses an afternoon of typing ---- */
const KEY='kengtung-places-draft';
function autosave(){ try{ localStorage.setItem(KEY, JSON.stringify(places)); }catch(e){} }
function restore(){
  try{
    const d = localStorage.getItem(KEY);
    if(d){ const p=JSON.parse(d); if(Array.isArray(p)&&p.length) return p; }
  }catch(e){}
  return null;
}

/* =======================================================================
   Validation
   ======================================================================= */
function problems(p, idx){
  const e=[];
  if(!p.id) e.push('id is empty');
  else if(!/^[a-z0-9-]+$/.test(p.id)) e.push('id may only use a-z, 0-9 and -');
  else if(places.some((o,i)=>i!==idx && o.id===p.id)) e.push('id "'+p.id+'" is already used');
  if(!p.name.en.trim()) e.push('English name is required');
  if(!(p.lat>=-90&&p.lat<=90)) e.push('lat must be between -90 and 90');
  if(!(p.lng>=-180&&p.lng<=180)) e.push('lng must be between -180 and 180');
  if(p.rating!=null && (p.rating<0||p.rating>5)) e.push('rating must be 0–5');
  return e;
}
function warnings(p){
  const w=[];
  ['name','description','address'].forEach(f=>{
    if(hasOrphan(p[f]?.my)) w.push(f+'.my: a vowel sign (ေ/ြ) sits before its consonant — click Fix');
  });
  if(!p.name.my.trim()) w.push('No Myanmar name — the app will fall back to English');
  if(!p.images.length) w.push('No photos — a coloured placeholder will be shown');
  if(!p.tags.length) w.push('No tags — this place will be harder to find in search');
  return w;
}

/* =======================================================================
   List
   ======================================================================= */
function renderList(){
  const q = ($('filter').value||'').toLowerCase();
  const html = places.map((p,i)=>{
    const hay = (p.id+' '+p.name.en+' '+p.name.my+' '+p.category).toLowerCase();
    if(q && !hay.includes(q)) return '';
    const bad = problems(p,i).length, warn = warnings(p).length;
    return `<div class="item ${i===sel?'sel':''}" onclick="pick(${i})">
      <span class="dot" style="background:${catColor(p.category)}"></span>
      <span style="flex:1;min-width:0">
        <b>${esc(p.name.en||'(untitled)')}</b>
        <small class="my">${esc(p.name.my||'—')}</small>
      </span>
      ${bad?'<span class="warn" title="has errors">⛔</span>':(warn?'<span class="warn" title="has warnings">⚠️</span>':'')}
    </div>`;
  }).join('');
  $('list').innerHTML = html || '<div class="hint" style="padding:12px">No match.</div>';
  $('count').textContent = places.length+' place'+(places.length===1?'':'s');

  const errs = places.reduce((n,p,i)=>n+problems(p,i).length,0);
  const wrns = places.reduce((n,p)=>n+warnings(p).length,0);
  $('status').innerHTML = places.length
    ? `${errs?'⛔ <b>'+errs+' error(s)</b> — fix before export':'✅ No errors'}<br>
       ${wrns? '⚠️ '+wrns+' warning(s)':'✨ No warnings'}<br>
       <span class="hint">Draft auto-saved in this browser.</span>`
    : 'Load a places.json or create a new place.';
}

function pick(i){ sel=i; renderList(); renderForm(); }

function addNew(){
  places.push(blank()); sel=places.length-1;
  autosave(); renderList(); renderForm();
  setTimeout(()=>$('f_name_en')?.focus(),60);
}

/* =======================================================================
   Form
   ======================================================================= */
function renderForm(){
  const p = places[sel];
  if(!p){
    $('editor').innerHTML = `<div class="card empty">
      <h3>No place selected</h3>
      <p>Load your <code>assets/data/places.json</code>, pick a place on the left,
         or press <b>➕ New place</b>.</p></div>`;
    return;
  }
  const errs = problems(p,sel), warns = warnings(p);

  $('editor').innerHTML = `
  <div class="card">
    <h2>Basics</h2>
    ${errs.length?`<div class="errmsg">⛔ ${errs.map(esc).join('<br>⛔ ')}</div>`:''}
    ${warns.length?`<div class="hint" style="color:var(--gold);font-weight:600">⚠️ ${warns.map(esc).join('<br>⚠️ ')}</div>`:''}

    <div class="row">
      <div><label>Name (English) *</label>
        <input id="f_name_en" value="${esc(p.name.en)}" oninput="setv('name.en',this.value);maybeId()"></div>
      <div><label>အမည် (မြန်မာ)</label>
        <input id="f_name_my" class="my" value="${esc(p.name.my)}" oninput="setv('name.my',this.value)">
        ${hasOrphan(p.name.my)?`<button class="gold" style="margin-top:6px;padding:5px 10px;font-size:12px" onclick="fixMy('name.my')">🔧 Fix letter order</button>`:''}
      </div>
    </div>

    <div class="row">
      <div><label>ID (filename-safe, must be unique) *</label>
        <input value="${esc(p.id)}" oninput="setv('id',this.value)"
               class="${errs.some(e=>e.includes('id'))?'err':''}">
        <div class="hint">Auto-filled from the English name. <code>a-z 0-9 -</code> only.</div></div>
      <div><label>Category *</label>
        <select onchange="setv('category',this.value)">
          ${CATS.map(c=>`<option value="${c[0]}" ${p.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}
        </select></div>
    </div>
  </div>

  <div class="card">
    <h2>Location</h2>
    <div class="row3">
      <div><label>Latitude *</label>
        <input type="number" step="0.000001" value="${p.lat}" oninput="setv('lat',parseFloat(this.value));moveMarker()"></div>
      <div><label>Longitude *</label>
        <input type="number" step="0.000001" value="${p.lng}" oninput="setv('lng',parseFloat(this.value));moveMarker()"></div>
      <div><label>Paste from Google Maps</label>
        <input placeholder="21.2913, 99.6002" onpaste="setTimeout(()=>pasteLatLng(this),0)"></div>
    </div>
    <div class="hint" style="margin-bottom:10px">
      👉 <b>Click anywhere on the map</b> to drop the pin, or drag the marker.
      In Google Maps: right-click the spot → the first menu entry is <code>lat, lng</code>.
    </div>
    <div id="map"></div>

    <div class="row" style="margin-top:4px">
      <div><label>Address (English)</label>
        <input value="${esc(p.address.en)}" oninput="setv('address.en',this.value)"></div>
      <div><label>လိပ်စာ (မြန်မာ)</label>
        <input class="my" value="${esc(p.address.my)}" oninput="setv('address.my',this.value)"></div>
    </div>
  </div>

  <div class="card">
    <h2>Description</h2>
    <div class="row">
      <div><label>English</label>
        <textarea oninput="setv('description.en',this.value)">${esc(p.description.en)}</textarea></div>
      <div><label>မြန်မာ</label>
        <textarea class="my" oninput="setv('description.my',this.value)">${esc(p.description.my)}</textarea>
        ${hasOrphan(p.description.my)?`<button class="gold" style="margin-top:6px;padding:5px 10px;font-size:12px" onclick="fixMy('description.my')">🔧 Fix letter order</button>`:''}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Photos</h2>
    <div class="hint">
      Copy your photo files into <code>assets/images/</code> first, then pick them here —
      the editor stores the path <code>assets/images/&lt;filename&gt;</code>.
      The first photo is the cover; the rest become the thumbnail strip.
    </div>
    <div class="imgs">
      ${p.images.map((src,i)=>`<div class="img">
          <div class="ph">${esc(src.split('/').pop())}</div>
          <span>${i===0?'COVER':'#'+(i+1)}</span>
          <b onclick="delImg(${i})">×</b>
        </div>`).join('')}
    </div>
    <div class="bar" style="border:0;padding:0;margin-top:12px">
      <button onclick="imgPick.click()">🖼️ Add photos…</button>
      <button onclick="addImgManual()">✏️ Add path manually</button>
      <input type="file" id="imgPick" accept="image/*" multiple hidden>
    </div>
  </div>

  <div class="card">
    <h2>Details</h2>
    <div class="row3">
      <div><label>Phone</label>
        <input value="${esc(p.phone||'')}" oninput="setv('phone',this.value)" placeholder="+95 ..."></div>
      <div><label>Opening hours</label>
        <input value="${esc(p.openHours||'')}" oninput="setv('openHours',this.value)" placeholder="08:00 – 17:00"></div>
      <div><label>Rating (0–5)</label>
        <input type="number" step="0.1" min="0" max="5" value="${p.rating??''}"
               oninput="setv('rating', this.value===''?null:parseFloat(this.value))"></div>
    </div>

    <label>Tags — these drive the search box</label>
    <input id="tagIn" placeholder="Type a tag and press Enter" onkeydown="if(event.key==='Enter'){addTag(this.value);this.value=''}">
    <div class="chips">
      ${p.tags.map((t,i)=>`<span class="chip ${/[\u1000-\u109F]/.test(t)?'my':''}">${esc(t)}<b onclick="delTag(${i})">×</b></span>`).join('')}
    </div>
    <div class="hint" style="margin-top:10px">Suggested for <b>${esc(p.category)}</b> — click to add:</div>
    <div class="chips">
      ${(TAG_SUGGEST[p.category]||[]).filter(t=>!p.tags.includes(t))
        .map(t=>`<span class="chip sug my" onclick="addTag('${t}')">+ ${esc(t)}</span>`).join('') || '<span class="hint">all added ✓</span>'}
    </div>
  </div>

  <div class="card">
    <div class="bar" style="border:0;padding:0;margin:0">
      <button class="primary" onclick="save()">💾 Download places.json</button>
      <button onclick="dupe()">⧉ Duplicate</button>
      <button class="danger" onclick="del()">🗑 Delete this place</button>
    </div>
  </div>`;

  initMap();
}

/* ---- field writers ---- */
function setv(path, val){
  const p = places[sel]; if(!p) return;
  const k = path.split('.');
  if(k.length===1) p[k[0]] = val; else p[k[0]][k[1]] = val;
  autosave();
  // Only the list needs an immediate repaint; re-rendering the whole form on
  // every keystroke would steal focus from the input being typed into.
  renderList();
}
function maybeId(){
  const p=places[sel];
  if(!p.id || p.id===slug(p.name.en.slice(0,-1)) ) { p.id = slug(p.name.en); }
  autosave();
}
function fixMy(path){
  const p=places[sel], k=path.split('.');
  const cur = k.length===1 ? p[k[0]] : p[k[0]][k[1]];
  const fixed = reorderMy(cur);
  if(k.length===1) p[k[0]]=fixed; else p[k[0]][k[1]]=fixed;
  autosave(); renderForm(); toast('Letter order repaired ✓');
}
function pasteLatLng(el){
  const m = (el.value||'').match(/(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/);
  if(!m){ toast('Could not read coordinates', true); return; }
  places[sel].lat = parseFloat(m[1]); places[sel].lng = parseFloat(m[2]);
  autosave(); renderForm(); toast('Coordinates set ✓');
}

/* ---- tags / images ---- */
function addTag(t){ t=(t||'').trim(); if(!t) return;
  const p=places[sel]; if(!p.tags.includes(t)) p.tags.push(t);
  autosave(); renderForm(); }
function delTag(i){ places[sel].tags.splice(i,1); autosave(); renderForm(); }
function delImg(i){ places[sel].images.splice(i,1); autosave(); renderForm(); }
function addImgManual(){
  const v = prompt('Asset path:', 'assets/images/');
  if(v && v.trim()){ places[sel].images.push(v.trim()); autosave(); renderForm(); }
}

/* ---- records ---- */
function dupe(){
  const c = JSON.parse(JSON.stringify(places[sel]));
  c.id = (c.id||'place')+'-copy'; c.name.en += ' (copy)';
  places.splice(sel+1,0,c); sel++; autosave(); renderList(); renderForm();
}
function del(){
  if(!confirm('Delete "'+(places[sel].name.en||'this place')+'"?')) return;
  places.splice(sel,1); sel=Math.min(sel,places.length-1);
  autosave(); renderList(); renderForm(); toast('Deleted');
}

/* =======================================================================
   Map
   ======================================================================= */
function initMap(){
  const el = $('map'); if(!el) return;
  if(typeof L === 'undefined'){
    el.innerHTML = `<div id="mapFallback">🌐 Map needs an internet connection.<br>
      Type the latitude / longitude above instead — everything else works offline.</div>`;
    return;
  }
  const p = places[sel];
  map = L.map(el).setView([p.lat,p.lng], 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);

  marker = L.marker([p.lat,p.lng], {draggable:true}).addTo(map);
  marker.on('dragend', e=>{
    const ll = e.target.getLatLng();
    writeLatLng(ll.lat, ll.lng);
  });
  map.on('click', e=> { marker.setLatLng(e.latlng); writeLatLng(e.latlng.lat, e.latlng.lng); });

  // Leaflet mis-measures a container that was just inserted into the DOM.
  setTimeout(()=>map.invalidateSize(), 120);
}
function writeLatLng(lat,lng){
  const p=places[sel];
  p.lat = +lat.toFixed(6); p.lng = +lng.toFixed(6);
  autosave();
  const ins = document.querySelectorAll('#editor input[type=number]');
  if(ins[0]) ins[0].value = p.lat;
  if(ins[1]) ins[1].value = p.lng;
  toast('📍 '+p.lat+', '+p.lng);
}
function moveMarker(){
  const p=places[sel];
  if(marker && isFinite(p.lat) && isFinite(p.lng)){
    marker.setLatLng([p.lat,p.lng]); map.panTo([p.lat,p.lng]);
  }
}

/* =======================================================================
   Load / Save
   ======================================================================= */
$('file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d)) throw new Error('Expected a JSON array');
      places = d.map(p=>Object.assign(blank(), p, {
        name:Object.assign({en:'',my:''},p.name),
        description:Object.assign({en:'',my:''},p.description),
        address:Object.assign({en:'',my:''},p.address),
        tags:p.tags||[], images:p.images||[],
      }));
      sel = places.length?0:-1;
      autosave(); renderList(); renderForm();
      toast('Loaded '+places.length+' places ✓');
    }catch(err){ toast('Could not read file: '+err.message, true); }
  };
  r.readAsText(f);
  e.target.value='';
};

/* Photo picker: the browser cannot reveal a real disk path, so we build the
   asset path from the filename. That matches the app as long as the file is
   copied into assets/images/. */
document.addEventListener('change', e=>{
  if(e.target.id!=='imgPick') return;
  const names = [...e.target.files].map(f=>'assets/images/'+f.name);
  places[sel].images.push(...names.filter(n=>!places[sel].images.includes(n)));
  autosave(); renderForm();
  toast('Added '+names.length+' — now copy the file(s) into assets/images/');
  e.target.value='';
});

function save(){
  const errs = places.flatMap((p,i)=>problems(p,i).map(e=>`[${p.id||i}] ${e}`));
  if(errs.length && !confirm('There are '+errs.length+' error(s):\n\n'+errs.slice(0,8).join('\n')+'\n\nDownload anyway?')) return;

  // Written in the exact key order the Dart model reads, and with
  // ensure_ascii off so Myanmar stays human-readable in the file.
  const out = places.map(p=>{
    const o = {id:p.id, name:p.name, category:p.category,
               description:p.description, address:p.address,
               lat:p.lat, lng:p.lng};
    if(p.phone)      o.phone = p.phone;
    if(p.openHours)  o.openHours = p.openHours;
    if(p.rating!=null) o.rating = p.rating;
    if(p.tags.length)   o.tags = p.tags;
    if(p.images.length) o.images = p.images;
    return o;
  });

  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'places.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast('Saved — replace assets/data/places.json, then press R in the app');
}

/* =======================================================================
   Boot
   ======================================================================= */
const draft = restore();
if(draft && confirm('An unsaved draft from this browser was found ('+draft.length+' places).\n\nRestore it?')){
  places = draft; sel = 0;
}
renderList(); renderForm();
</script>
