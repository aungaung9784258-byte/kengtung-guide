name: kengtung_guide
description: Kengtung (Kyaing Tong) Travel Guide - mobile and web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Map (free: flutter_map + OpenStreetMap raster tiles, no API key, no billing)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS
  geolocator: ^12.0.0

  # Networking (OSRM routing, free public endpoint)
  http: ^1.2.2

  # Local storage for settings + favourites
  shared_preferences: ^2.2.3

  # Offline mode: tile caching + connectivity detection
  flutter_cache_manager: ^3.3.2
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3

  # Misc
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  intl: ^0.20.3

  # Vector animations for the splash and welcome screens.
  # animated_splash_screen was removed on purpose: it pushes its own
  # Navigator route, which fights go_router's StatefulShellRoute.
  lottie: ^3.6.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  archive: ^4.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/about/
    - assets/images/villages/
    - assets/lottie/

  fonts:
    - family: Padauk
      fonts:
        - asset: assets/fonts/Padauk-Regular.ttf
          weight: 400
        - asset: assets/fonts/Padauk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B3B30"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true     