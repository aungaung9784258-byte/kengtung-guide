name: kengtung_guide
description: Kengtung (Kyaing Tong) Travel Guide - mobile and web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Map (free: flutter_map + OpenStreetMap raster tiles, no API key, no billing)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS
  geolocator: ^12.0.0

  # Networking (OSRM routing, free public endpoint)
  http: ^1.2.2

  # Local storage for settings + favourites
  shared_preferences: ^2.2.3

  # Offline mode: tile caching + connectivity detection
  flutter_cache_manager: ^3.3.2
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3

  # Misc
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  # Padauk (SIL, Open Font License) renders Myanmar Unicode correctly on
  # every device, including phones whose system font is old or Zawgyi-only.
  # It is registered as a FALLBACK, so Latin text keeps the default font.
  fonts:
    - family: Padauk
      fonts:
        - asset: assets/fonts/Padauk-Regular.ttf
        - asset: assets/fonts/Padauk-Bold.ttf
          weight: 700
